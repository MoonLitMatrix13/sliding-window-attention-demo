<div class="swa-wrap">
    <div class="mode-row">
      <button class="mode-btn active" id="btn-swa">Sliding window</button>
      <button class="mode-btn" id="btn-full">Full attention</button>
      <button class="mode-btn" id="btn-play">▶ Auto Play</button>
    </div>
  
    <div class="label-row">
      <span class="ctrl-label">Sequence length</span>
      <input type="range" min="6" max="20" value="12" step="1" id="sl-seq">
      <span class="val-badge" id="out-seq">12</span>
    </div>
  
    <div class="label-row">
      <span class="ctrl-label">Window size</span>
      <input type="range" min="2" max="10" value="4" step="1" id="sl-win">
      <span class="val-badge" id="out-win">4</span>
    </div>
  
    <div class="label-row">
      <span class="ctrl-label">Query token</span>
      <input type="range" min="0" max="11" value="7" step="1" id="sl-q">
      <span class="val-badge" id="out-q">8</span>
    </div>
  
    <canvas id="cvs"></canvas>
  
    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">Pairs computed</div>
        <div class="stat-val warn" id="st-pairs">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Full attention</div>
        <div class="stat-val" id="st-full">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Memory saved</div>
        <div class="stat-val good" id="st-save">—</div>
      </div>
    </div>
  
    <div class="insight" id="insight-text"></div>
  </div>
