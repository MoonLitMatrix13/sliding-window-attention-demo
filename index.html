<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sliding Window Attention</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="controls">

    <div class="mode-row">
      <button class="mode-btn active" id="btn-swa">
        Sliding window
      </button>

      <button class="mode-btn" id="btn-full">
        Full attention
      </button>

      <button class="mode-btn" id="btn-play">
        ▶ Auto Play
      </button>
    </div>

    <div class="slider-row">
      <label>Sequence length</label>
      <input type="range" min="6" max="20" value="12" id="sl-seq">
      <span id="out-seq">12</span>
    </div>

    <div class="slider-row">
      <label>Window size</label>
      <input type="range" min="2" max="10" value="4" id="sl-win">
      <span id="out-win">4</span>
    </div>

    <div class="slider-row">
      <label>Query token</label>
      <input type="range" min="0" max="11" value="7" id="sl-q">
      <span id="out-q">8</span>
    </div>

  </div>

  <div class="canvas-card">
    <canvas id="cvs"></canvas>
  </div>

  <div class="stats">

    <div class="stat-card">
      <div class="stat-label">PAIRS COMPUTED</div>
      <div class="stat-value orange" id="st-pairs">4</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">FULL ATTENTION</div>
      <div class="stat-value" id="st-full">144</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">MEMORY SAVED</div>
      <div class="stat-value green" id="st-save">97%</div>
    </div>

  </div>

  <div class="insight" id="insight-text">
    Token 8 attends locally (6–9)
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
